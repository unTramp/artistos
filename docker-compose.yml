services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: artistos
      POSTGRES_USER: artistos
      POSTGRES_PASSWORD: artistos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artistos -d artistos"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - artistos_pg:/var/lib/postgresql/data
volumes:
  artistos_pg:
