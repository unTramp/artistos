name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: artistos_ci
          POSTGRES_USER: artistos
          POSTGRES_PASSWORD: artistos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artistos -d artistos_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://artistos:artistos@127.0.0.1:5432/artistos_ci
      AUTH_SECRET: stage0-ci-secret-is-at-least-32-characters-long
      AUTH_BASE_URL: http://127.0.0.1:3000
      ARTIST_OS_DEFAULT_TIMEZONE: UTC
      AI_PROVIDER: disabled
      LOG_LEVEL: error
      STORAGE_ROOT: .data/storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.4.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm arch:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
