name: Bootstrap Artist OS docs

on:
  push:
    branches:
      - docs/artist-os-spec-completion
    paths:
      - '.docbundle/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/artist-os-spec-completion
          fetch-depth: 0

      - name: Reconstruct documentation source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .docbundle/artist-os-docs.tar.xz.b64.part-* > /tmp/artist-os-docs.tar.xz.b64
          base64 --decode /tmp/artist-os-docs.tar.xz.b64 > /tmp/artist-os-docs.tar.xz
          rm -rf /tmp/artist-os-docs docs/artist-os
          mkdir -p /tmp/artist-os-docs docs
          tar -xJf /tmp/artist-os-docs.tar.xz -C /tmp
          mv /tmp/artist-os-docs docs/artist-os

      - name: Remove one-time bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .docbundle
          rm -f .github/workflows/bootstrap-artist-os-docs.yml

      - name: Commit expanded documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: sync complete Artist OS product and engineering specification"
          git push origin HEAD:docs/artist-os-spec-completion
